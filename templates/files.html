{% extends "base.html" %}
{% block title %}View Files{% endblock %}

{% block content %}
<h2>All Accessible PDFs</h2>
<ul>
  {% for doc in pdf_docs %}
  <li>
    <a href="{{ url_for('view_file', filename=doc.filename) }}" target="_blank">
      {{ doc.filename }}
    </a>
    (Uploaded by user #{{ doc.uploaded_by }})
  </li>
  {% endfor %}
</ul>
{% endblock content %}
