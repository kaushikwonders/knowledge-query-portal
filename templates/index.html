{% extends "base.html" %}
{% block title %}Upload PDFs{% endblock %}

{% block content %}
<h2>Upload PDFs</h2>
<form method="POST" action="{{ url_for('upload_page') }}" enctype="multipart/form-data">
  <label>Select PDF(s):</label><br>
  <input type="file" name="pdf_files" multiple accept=".pdf">
  <br><br>
  <button type="submit" class="btn">Upload</button>
</form>
{% endblock content %}
